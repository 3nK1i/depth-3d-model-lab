# EIA TECH — Depth & 3D Model Lab
# Release metadata and documented application defaults.
#
# Runtime GPU selection remains capability-driven in core/hardware/profiles.py;
# moving from RTX 2060 to RTX 5090 never requires editing this file.

app:
  name: "EIA TECH - Depth & 3D Model Lab"
  version: "0.5.0"
  release: "Phase 5 Stable"

window:
  min_width: 1366
  min_height: 768

runtime:
  stop_timeout_seconds: 5
  model_load_timeout_seconds: 180
  inference_result_timeout_seconds: 30

logging:
  directory: "logs"
  app_file: "app.log"
  worker_file: "worker.log"
  max_bytes: 5_000_000
  backup_count: 5
  level: "INFO"
