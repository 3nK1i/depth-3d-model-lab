[project]
name = "depth-3d-model-lab"
version = "0.7.5"
description = "EIA TECH - live monocular depth estimation and interactive 3D point-cloud visualization"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "PyQt6>=6.7,<6.9",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "vispy>=0.14,<0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
]
moge2 = [
    "moge @ git+https://github.com/microsoft/MoGe.git",
]
depth-pro = [
    "numpy>=1.26,<2",
    "depth_pro @ git+https://github.com/apple/ml-depth-pro.git",
]
unidepth-v2 = [
    "numpy>=1.26,<2",
    "einops>=0.7",
    "huggingface-hub>=0.22",
    "timm>=1.0",
]
metric3d-v2 = [
    "mmengine>=0.10.4,<1",
    "mmcv-lite>=2.1,<2.3",
    "timm>=1.0,<2",
    "einops>=0.7,<1",
    "iopath>=0.1.10,<1",
    "plyfile>=1.0,<2",
    "tensorboardX>=2.6,<3",
    "imgaug>=0.4,<1",
    "imagecorruptions>=1.1,<2",
    "huggingface-hub>=0.22,<2",
]
depth-anything-v2 = [
    "huggingface-hub>=0.22,<2",
    "matplotlib>=3.8,<4",
]
video-depth-anything = [
    "huggingface-hub>=0.22,<2",
    "einops>=0.7,<1",
    "easydict>=1.13,<2",
    "imageio>=2.34,<3",
    "imageio-ffmpeg>=0.4.9,<1",
    "matplotlib>=3.8,<4",
    "Pillow>=10,<12",
    "tqdm>=4.66,<5",
]
marigold = [
    "diffusers>=0.30,<0.40",
    "transformers>=4.32,<5",
    "accelerate>=0.26,<2",
    "huggingface-hub>=0.22,<2",
    "safetensors>=0.4,<1",
    "Pillow>=10,<12",
    "scipy>=1.11,<2",
]

ultralytics-perception = [
    "ultralytics>=8.4,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*"]
