[project]
name = "depth-3d-model-lab"
version = "0.5.0"
description = "EIA TECH - live monocular depth estimation and interactive 3D point-cloud visualization"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "PyQt6>=6.7,<6.9",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "vispy>=0.14,<0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
moge2 = [
    "moge @ git+https://github.com/microsoft/MoGe.git",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*"]
